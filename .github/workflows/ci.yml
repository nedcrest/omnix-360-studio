# Every push and pull request: the workspace (Omnix and the sheet core)
# builds, its tests pass and clippy reads it. The GPU tests run on
# lavapipe, Mesa's Vulkan on the CPU, so the CPU and GPU paths are compared
# here too; the CLI tests export real files through ffmpeg.
name: CI

# Not for a change to the docs, the pictures or the agent's skills alone
# (the free Actions minutes: the user, 2026-11-15); by hand for anything.
on:
  push:
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!.claude/**'
      # The guide's keys and commands pages are made from the code and a
      # test holds them to it: a hand edit there must still be caught.
      - 'docs/guide/keys-*.md'
      - 'docs/guide/commands-*.md'
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!.claude/**'
      # The guide's keys and commands pages are made from the code and a
      # test holds them to it: a hand edit there must still be caught.
      - 'docs/guide/keys-*.md'
      - 'docs/guide/commands-*.md'
  # By hand too (the Actions tab, or gh workflow run CI): the first push
  # to a new repo started no run.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries, ffmpeg and a CPU Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev ffmpeg mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked --workspace --all-targets
      - name: Test
        run: cargo test --locked --workspace
        env:
          # A GPU test without a GPU fails here instead of passing unseen.
          OMNIX_REQUIRE_GPU: "1"
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets

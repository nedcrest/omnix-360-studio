[package]
name = "omnix"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
# The local date and time in a recorded take's name.
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# Text overlays: iced's own text engine (the same version), for laying out
# and drawing text into pictures.
cosmic-text = "0.15.0"
cpal = "0.18"
iced = { version = "0.14.0", features = ["advanced", "advanced-shaping", "canvas", "svg", "image"] }
# PNG for pictures and stills; JPEG for the project cards' frame strips.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
rayon = "1.12.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
# Pinned: the clip cache (`cache::FORMAT`) holds what this commit parses; move
# the pin on purpose, bumping FORMAT if the rig or attitude changes.
telemetry-parser = { git = "https://github.com/AdrianEddy/telemetry-parser.git", rev = "8bd825db33700c4d4472fae61eada27a65aea7a8", version = "0.4.0" }
schemars = { version = "1.2.3", features = ["preserve_order"] }
# The contact sheet's core, shared with Dailix (`crates/sheet`): the bin
# reads and changes the sheet's marks through it (`src/notes.rs`).
dailix-sheet = { path = "crates/sheet" }
# The bin's Move to trash: the system's own trash, so it can be restored.
trash = { version = "5", default-features = false }

# The file managers' D-Bus interface, so Show in folder selects the file
# (the Info panel).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[lints.clippy]
# Functions stay short (code-rules): over clippy.toml's 80 lines is a warning.
too_many_lines = "warn"

# Omnix and the contact sheet's core it shares with Dailix: Dailix builds
# against both from this repo, so neither needs the other's clone.
[workspace]
members = [".", "crates/sheet"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
# preserve_order: a sheet read and written back keeps its keys' order.
serde_json = { version = "1.0.151", features = ["preserve_order"] }
indexmap = { version = "2.14.2", features = ["serde"] }
schemars = { version = "1.2.3", features = ["preserve_order", "indexmap2"] }

[workspace.lints.clippy]
too_many_lines = "warn"
